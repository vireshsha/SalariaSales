name: SalariaSales
options:
  bundleIdPrefix: com.salaria
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
targets:
  SalariaSales:
    type: application
    platform: iOS
    sources:
      - path: SalariaSales
        excludes:
          - "**/Info.plist"
    resources:
      - path: SalariaSales/Resources
    info:
      path: SalariaSales/Info.plist
      properties:
        CFBundleDisplayName: Salaria Jobs
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.salaria.jobs
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: SalariaSales/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      TARGETED_DEVICE_FAMILY: "1"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
  SalariaSalesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SalariaSalesTests
    dependencies:
      - target: SalariaSales
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.salaria.jobs.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SalariaSales.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SalariaSales"
schemes:
  SalariaSales:
    build:
      targets:
        SalariaSales: all
        SalariaSalesTests: [test]
    test:
      targets:
        - SalariaSalesTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
